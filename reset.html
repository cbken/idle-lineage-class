<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修復工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #14161d;
            font-family: "Noto Sans TC", -apple-system, sans-serif;
            color: #e8e6e0;
        }
        .card {
            width: min(90vw, 400px);
            background: #1e2230;
            border: 1px solid #3a4055;
            border-radius: 14px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,.5);
        }
        .icon { font-size: 42px; margin-bottom: 14px; }
        h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 13px; color: #9aa0b5; line-height: 1.8; }
        #log { margin-top: 18px; font-size: 13px; color: #a7f3d0; text-align: left; line-height: 2; min-height: 60px; }
        .fail { color: #e07a7a; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔧</div>
        <h1>頁面修復工具</h1>
        <p>正在清掉這台裝置卡住的舊版頁面快取。<br>你的遊戲進度<b>不會</b>被動到。</p>
        <div id="log"></div>
    </div>
    <script>
    (function(){
        var log = document.getElementById('log');
        function line(msg, bad){ var d = document.createElement('div'); d.textContent = msg; if (bad) d.className = 'fail'; log.appendChild(d); }

        var p1 = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
            ? navigator.serviceWorker.getRegistrations().then(function(regs){
                return Promise.all(regs.map(function(r){ return r.unregister(); })).then(function(){
                    line('✅ 離線快取程式已移除（' + regs.length + ' 個）');
                });
              }).catch(function(){ line('⚠️ 離線快取程式移除失敗（可能本來就沒有）', true); })
            : Promise.resolve(line('✅ 這個瀏覽器沒有離線快取程式'));

        var p2 = (window.caches && caches.keys)
            ? caches.keys().then(function(names){
                return Promise.all(names.map(function(n){ return caches.delete(n); })).then(function(){
                    line('✅ 舊版頁面快取已清空（' + names.length + ' 桶）');
                });
              }).catch(function(){ line('⚠️ 快取清除失敗', true); })
            : Promise.resolve(line('✅ 沒有頁面快取要清'));

        Promise.all([p1, p2]).then(function(){
            line('🎉 完成！3 秒後帶你回遊戲（會重新從網路抓最新版）…');
            setTimeout(function(){ location.replace('./?fresh=' + Date.now()); }, 3000);
        });
    })();
    </script>
</body>
</html>
